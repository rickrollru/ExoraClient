<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 -22 244 244" width="244" height="244">
  <defs>
    <linearGradient id="exBody" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="0.55" stop-color="#7B5CFF"/>
      <stop offset="1" stop-color="#FF5C8A"/>
    </linearGradient>
    <radialGradient id="exShine" cx="0.32" cy="0.26" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="exShade" cx="0.5" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#1A0F3A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1A0F3A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="exRing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DD6A4"/>
      <stop offset="0.5" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="exGlow" filterUnits="userSpaceOnUse" x="-120" y="-120" width="480" height="480"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="exSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="exBack"><rect x="-20" y="-20" width="240" height="108"/></clipPath>
    <clipPath id="exFront"><rect x="-20" y="108" width="240" height="120"/></clipPath>
  </defs>
  <!-- glow -->
  <circle cx="100" cy="100" r="58" fill="url(#exBody)" filter="url(#exGlow)" opacity="0.55"/>
  <!-- orbit, back half -->
  <g transform="rotate(-20 100 108)">
    <ellipse cx="100" cy="108" rx="90" ry="28" fill="none" stroke="url(#exRing)" stroke-width="7" clip-path="url(#exBack)" opacity="0.55"/>
  </g>
  <!-- tee body -->
  <circle cx="100" cy="100" r="58" fill="url(#exBody)"/>
  <circle cx="100" cy="100" r="58" fill="url(#exShade)"/>
  <circle cx="100" cy="100" r="58" fill="url(#exShine)"/>
  <!-- eyes, looking forward and up -->
  <ellipse cx="111" cy="86" rx="10" ry="15" fill="#FFFFFF"/>
  <ellipse cx="137" cy="86" rx="10" ry="15" fill="#FFFFFF"/>
  <ellipse cx="115" cy="82" rx="5" ry="7" fill="#0A0B0E"/>
  <ellipse cx="141" cy="82" rx="5" ry="7" fill="#0A0B0E"/>
  <!-- orbit, front half -->
  <g transform="rotate(-20 100 108)">
    <ellipse cx="100" cy="108" rx="90" ry="28" fill="none" stroke="url(#exRing)" stroke-width="12" clip-path="url(#exFront)" filter="url(#exSoft)" opacity="0.6"/>
    <ellipse cx="100" cy="108" rx="90" ry="28" fill="none" stroke="url(#exRing)" stroke-width="7" clip-path="url(#exFront)"/>
  </g>
  <!-- spark on the orbit -->
  <g transform="translate(184 77)">
    <circle r="12" fill="#FFFFFF" filter="url(#exGlow)" opacity="0.9"/>
    <path d="M0 -15 C1.5 -4 4 -1.5 15 0 C4 1.5 1.5 4 0 15 C-1.5 4 -4 1.5 -15 0 C-4 -1.5 -1.5 -4 0 -15Z" fill="#FFFFFF"/>
  </g>
</svg>
